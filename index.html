<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercices imprimables</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header no-print">
    <div class="container">
      <a href="index.html" class="brand">📚 Exercices imprimables</a>
    </div>
  </header>

  <main class="container">
    <h1>Liste des exercices</h1>
    <p class="lead">Rechercher, filtrer et imprimer des exercices scolaires.</p>

    <div class="toolbar no-print">
      <label>
        Rechercher
        <input type="search" id="search" placeholder="Nom de l'exercice...">
      </label>

      <label>
        Niveau
        <select id="niveau">
          <option value="">Tous les niveaux</option>
        </select>
      </label>
    </div>

    <div id="liste" class="exercice-list"></div>
  </main>

  <script>
    let exercices = [];

    async function chargerExercices() {
      try {
        const response = await fetch("exercices.json");
        exercices = await response.json();

        const niveaux = [...new Set(exercices.map(ex => ex.niveau).filter(Boolean))];
        const selectNiveau = document.getElementById("niveau");

        niveaux.forEach(niveau => {
          const option = document.createElement("option");
          option.value = niveau;
          option.textContent = niveau;
          selectNiveau.appendChild(option);
        });

        afficherExercices(exercices);
      } catch (err) {
        document.getElementById("liste").innerHTML =
          '<div class="error-state">Impossible de charger les exercices.</div>';
      }
    }

    function afficherExercices(listeExercices) {
      const liste = document.getElementById("liste");
      liste.innerHTML = "";

      if (listeExercices.length === 0) {
        liste.innerHTML = '<div class="empty-state">Aucun exercice trouvé.</div>';
        return;
      }

      listeExercices.forEach(exercice => {
        const card = document.createElement("article");
        card.className = "exercice-card";

        card.innerHTML = `
          <a href="exercice.html?id=${encodeURIComponent(exercice.id)}">
            <span class="exercice-meta">${escapeHtml(exercice.niveau || "—")}</span>
            <h2>${escapeHtml(exercice.titre)}</h2>
            <p>${escapeHtml(exercice.description || "")}</p>
          </a>
        `;

        liste.appendChild(card);
      });
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function filtrer() {
      const recherche = document.getElementById("search").value.toLowerCase();
      const niveau = document.getElementById("niveau").value;

      const resultats = exercices.filter(exercice => {
        const correspondNiveau = !niveau || exercice.niveau === niveau;

        const correspondRecherche =
          (exercice.titre || "").toLowerCase().includes(recherche) ||
          (exercice.description || "").toLowerCase().includes(recherche);

        return correspondNiveau && correspondRecherche;
      });

      afficherExercices(resultats);
    }

    document.getElementById("search").addEventListener("input", filtrer);
    document.getElementById("niveau").addEventListener("change", filtrer);

    chargerExercices();
  </script>
</body>
</html>
