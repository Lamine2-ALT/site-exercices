<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercice</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header no-print">
    <div class="container">
      <a href="index.html" class="brand">📚 Exercices imprimables</a>
    </div>
  </header>

  <main class="container">
    <div class="actions no-print">
      <a href="index.html" class="btn btn-secondary">← Retour</a>
      <button class="btn btn-primary" onclick="window.print()">🖨️ Imprimer</button>
    </div>

    <div id="exercise" class="exercice-panel">
      <div class="exercice-content">
        <p>Chargement de l'exercice...</p>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    async function chargerExercice() {
      try {
        const response = await fetch("exercices.json");
        const exercices = await response.json();
        const exercice = exercices.find(item => item.id === id);
        const zoneExercice = document.getElementById("exercise");

        if (!exercice) {
          zoneExercice.innerHTML = '<div class="error-state">Exercice introuvable.</div>';
          return;
        }

        document.title = exercice.titre;

        zoneExercice.innerHTML = `
          <span class="exercice-meta">${exercice.niveau || ""}</span>
          <h1>${exercice.titre}</h1>
          ${exercice.description ? `<p class="lead">${exercice.description}</p>` : ""}
          <div class="exercice-content">${exercice.html}</div>
        `;
      } catch (err) {
        document.getElementById("exercise").innerHTML =
          '<div class="error-state">Erreur de chargement.</div>';
      }
    }

    chargerExercice();
  </script>
</body>
</html>
